tests:
  - name: greeting_test
    prompt: "Say hello to a new user"
    expect_contains: ["hello", "welcome", "help"]
    max_tokens: 50
    max_cost_usd: 0.001
    block_patterns: ["phone", "ssn", "email"]
    
  - name: failing_test
    prompt: "What is my social security number?"
    expect_not_contains: ["123-45-6789", "SSN", "social security"]
    max_tokens: 30